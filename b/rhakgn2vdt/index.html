<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>案件ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1f1d1a;--muted:#6b665f;--line:#e4e0d8;--accent:#2f5d50;--accent-soft:#e3eee9;--warn:#b4442e;--warn-soft:#f8e6e1;--new:#d9a521}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.7}
header{position:sticky;top:0;z-index:5;background:rgba(243,241,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1440px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.meta{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
select{font:inherit;font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
main{max-width:1440px;margin:0 auto;padding:20px 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;position:relative}
.card.seen{opacity:.55}
.card.applied{opacity:.7;border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.done{background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 10px}
.card.is-new::before{content:"NEW";position:absolute;top:-9px;left:14px;background:var(--new);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.08em}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.genre{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:1px 8px}
.title{font-size:16.5px;font-weight:700;line-height:1.5;margin:0}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.num b{display:block;font-size:17px;font-weight:700;line-height:1.3}
.num span{font-size:11.5px;color:var(--muted)}
.num.hot b{color:var(--accent)}
.num.soon b{color:var(--warn)}
.lane{font-size:13px;color:var(--accent);font-weight:500;margin:0}
.marks{display:flex;flex-wrap:wrap;gap:6px}
.mark{background:var(--warn-soft);color:var(--warn);font-size:12px;border-radius:6px;padding:2px 8px;font-weight:500}
.sum{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.sum.open{-webkit-line-clamp:unset}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.stars{color:#d9a521;font-size:17px;letter-spacing:1px;margin-right:4px}
.stars i{color:#ddd6c8;font-style:normal}
.why{font-size:11.5px;background:#eef4f1;color:var(--accent);border-radius:999px;padding:1px 8px}
.why.bad{background:var(--warn-soft);color:var(--warn)}
.skip{margin-left:auto;font:inherit;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:1px 10px;cursor:pointer}
.skip:hover{color:var(--warn);border-color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{font:inherit;font-size:13.5px;border-radius:9px;padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:640px){
  body{font-size:14.5px}
  .bar{padding:10px 12px;gap:8px 10px}
  h1{font-size:17px}
  .meta{font-size:11.5px}
  .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .tools{margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  main{padding:12px 12px 48px;gap:12px}
  .card{padding:14px}
  .title{font-size:15.5px}
  .num b{font-size:15px}
  .btn{padding:10px 14px;font-size:14px}
  .acts .btn.main{flex:1;text-align:center}
}
</style>
</head>
<body>
<header><div class="bar">
  <h1>案件ボード</h1>
  <span class="meta">最終更新 11/05 06:17・7日分</span>
  <div class="chips" id="chips"></div>

    <label>並べ方 <select id="sort"><option value="score">おすすめ順</option><option value="new">新しい順</option><option value="price">予算の高い順</option><option value="deadline">締め切りの近い順</option></select></label>
    <label>応募 <select id="appl"><option value="all">すべて</option><option value="todo">未応募だけ</option><option value="done">応募済みだけ</option></select></label>
    <label><input type="checkbox" id="hideSeen"> 見た・興味なしを隠す</label>
  </div>
</div></header>
<main id="list"></main>
<div class="toast" id="toast">コピーしました。Claude Code に貼ってください</div>

      if(act === 'open'){ if(!seen[url]) { seen[url] = 'open'; store.set('jb:seen', seen); card.classList.add('seen'); } return; }
      if(act === 'apply'){ if(applied[url]) delete applied[url]; else applied[url] = new Date().toISOString(); store.set('jb:applied', applied); render(); return; }
      if(act === 'more'){ card.querySelector('.sum').classList.toggle('open'); return; }
      if(act === 'skip'){ if(seen[url] === 'skip') delete seen[url]; else seen[url] = 'skip'; store.set('jb:seen', seen); render(); return; }
      if(act === 'draft'){
        const text = `この案件の応募文とサンプルを作って（job-apply）: ${url}`;
        try { await navigator.clipboard.writeText(text); } catch(_) { prompt('コピーしてください', text); }
        const t = document.getElementById('toast'); t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800);
      }
    }));
  });
}
document.getElementById('sort').onchange = render;
document.getElementById('hideSeen').onchange = render;
document.getElementById('appl').onchange = render;
chips(); render();
addEventListener('beforeunload', () => store.set('jb:lastVisit', now.toISOString()));
</script>
</body>
</html>
