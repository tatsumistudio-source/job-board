<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>案件ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1f1d1a;--muted:#6b665f;--line:#e4e0d8;--accent:#2f5d50;--accent-soft:#e3eee9;--warn:#b4442e;--warn-soft:#f8e6e1;--new:#d9a521}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.7}
header{position:sticky;top:0;z-index:5;background:rgba(243,241,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1440px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.meta{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
select{font:inherit;font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
main{max-width:1440px;margin:0 auto;padding:20px 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;position:relative}
.card.seen{opacity:.55}
.card.applied{opacity:.7;border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.done{background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 10px}
.card.is-new::before{content:"NEW";position:absolute;top:-9px;left:14px;background:var(--new);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.08em}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.genre{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:1px 8px}
.title{font-size:16.5px;font-weight:700;line-height:1.5;margin:0}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.num b{display:block;font-size:17px;font-weight:700;line-height:1.3}
.num span{font-size:11.5px;color:var(--muted)}
.num.hot b{color:var(--accent)}
.num.soon b{color:var(--warn)}
.lane{font-size:13px;color:var(--accent);font-weight:500;margin:0}
.marks{display:flex;flex-wrap:wrap;gap:6px}
.mark{background:var(--warn-soft);color:var(--warn);font-size:12px;border-radius:6px;padding:2px 8px;font-weight:500}
.sum{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.sum.open{-webkit-line-clamp:unset}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.stars{color:#d9a521;font-size:17px;letter-spacing:1px;margin-right:4px}
.stars i{color:#ddd6c8;font-style:normal}
.why{font-size:11.5px;background:#eef4f1;color:var(--accent);border-radius:999px;padding:1px 8px}
.why.bad{background:var(--warn-soft);color:var(--warn)}
.skip{margin-left:auto;font:inherit;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:1px 10px;cursor:pointer}
.skip:hover{color:var(--warn);border-color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{font:inherit;font-size:13.5px;border-radius:9px;padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:640px){
  body{font-size:14.5px}
  .bar{padding:10px 12px;gap:8px 10px}
  h1{font-size:17px}
  .meta{font-size:11.5px}
  .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .tools{margin-left:0;width:100%;justify-content:space-between;font-size:12px}
  main{padding:12px 12px 48px;gap:12px}
  .card{padding:14px}
  .title{font-size:15.5px}
  .num b{font-size:15px}
  .btn{padding:10px 14px;font-size:14px}
  .acts .btn.main{flex:1;text-align:center}
}
</style>
</head>
<body>
<header><div class="bar">
  <h1>案件ボード</h1>
  <span class="meta">最終更新 10/10 21:27・7日分</span>
  <div class="chips" id="chips"></div>
  <div class="tools">

    <label>応募 <select id="appl"><option value="all">すべて</option><option value="todo">未応募だけ</option><option value="done">応募済みだけ</option></select></label>
    <label><input type="checkbox" id="hideSeen"> 見た・興味なしを隠す</label>
  </div>
</div></header>
<main id="list"></main>
<div class="toast" id="toast">コピーしました。Claude Code に貼ってください</div>

const store = { get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
                set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} } };
const applied = store.get('jb:applied', {});
const seen = store.get('jb:seen', {}), lastVisit = store.get('jb:lastVisit', null);
const now = new Date();
let genre = 'すべて';
const fmtDate = s => { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const age = s => { if(!s) return '—'; const m = (now - new Date(s))/60000; if(m < 60) return `${Math.max(1,Math.round(m))}分前`; if(m < 2880) return `${Math.round(m/60)}時間前`; return `${Math.round(m/1440)}日前`; };
const daysLeft = s => s ? Math.ceil((new Date(s + 'T23:59:59+09:00') - now) / 86400000) : null;
const yen = n => n ? n.toLocaleString('ja-JP') + '円' : '—';
// おすすめ度（★1〜5）。Actions で AI を動かすと API 課金になるため、決まった計算で付ける（2026-10-01）
const FIT = {'実績づくり':3, '動画編集':3, '字幕・テロップ':3, 'ショート・切り抜き':2, '文字起こし':2, 'LP・HP制作':2, '台本・構成':1, '文字PV':1, 'サムネ・画像':1};
const FLOOR = {'実績づくり':200, '動画編集':10000, '字幕・テロップ':5000, 'ショート・切り抜き':5000, '文字起こし':3000, 'LP・HP制作':30000, '台本・構成':3000, '文字PV':10000, 'サムネ・画像':3000};
function score(j){
  let p = 0; const why = [], bad = []; let severe = false;
  const fit = FIT[j.genre] || 0; p += fit;
  if(fit >= 3) why.push('得意ジャンル'); else if(fit === 2) why.push('作れるジャンル');
  // CrowdWorks の固定報酬は案件全体の予算なので単価の判定に使わない。本文の「1本◯円」がある時だけ見る
  const floor = FLOOR[j.genre] || 5000;
  const unit = j.unit_price ? Number(((j.unit_price.match(/([\d,]+)円/)||[])[1]||'0').replace(/,/g,'')) : null;
  // 「20,000円/5本」「5本で20,000円」のような書き方からも1本あたりを出す
  let perUnit = unit;
  if(!perUnit){ const t = (j.title + ' ' + j.summary).normalize('NFKC');
    let m = t.match(/([\d,]+)円\s*[\/／]\s*(\d+)\s*本/) || null, n;
    if(m) perUnit = Number(m[1].replace(/,/g,'')) / Number(m[2]);
    else if((n = t.match(/(\d+)\s*本で\s*([\d,]+)円/))) perUnit = Number(n[2].replace(/,/g,'')) / Number(n[1]); }
  const price = perUnit || (j.budget_note ? null : j.price_min);
  if(price){ if(price >= floor*3){ p += 2; why.push('単価高め'); } else if(price >= floor*1.5){ p += 1; why.push('単価まずまず'); } else if(price < floor){ p -= 1; bad.push('単価低め'); } }
  if(/継続|長期/.test(j.title + j.summary)){ p += 0.5; why.push('継続案件'); }
  const h = j.posted_at ? (now - new Date(j.posted_at))/3600000 : null;
  if(h !== null && h <= 6){ p += 1; why.push('新着'); } else if(h !== null && h >= 72){ p -= 0.5; bad.push('公開から日数あり'); }
  if(j.hope_number && (j.num_contracts||0) >= j.hope_number){ severe = true; bad.push('枠が埋まっている可能性'); }
  const left = daysLeft(j.expired_on); if(left !== null && left < 0){ severe = true; bad.push('期限切れ'); }
  j.marks.forEach(m => {
    if(m.startsWith('勧誘')){ severe = true; bad.push('勧誘の疑い'); }
    else if(m.startsWith('出社')){ severe = true; bad.push('出社あり'); }
    else if(m.startsWith('AI使用禁止')){ p -= 1.5; bad.push('AI使用禁止'); }
    else if(m.startsWith('顔出し')){ p -= 1; bad.push('顔出しあり'); }
    else if(m.startsWith('同じ題名')){ p -= 0.5; }
  });
  if(severe) p -= 10;
  return {p, severe, why, bad};
}
// ★はボードに載っている案件どうしの順位で付ける（上位15%=★5・次25%=★4・次35%=★3・残り=★2・重大な注意=★1）
const SCORES = new Map();
(function rank(){
  const all = DATA.jobs.map(j => [j.url, score(j)]);
  const ok = all.filter(([,s]) => !s.severe).sort((a,b) => b[1].p - a[1].p);
  ok.forEach(([url, s], i) => { const r = (i + 0.5) / ok.length; s.stars = r <= .15 ? 5 : r <= .40 ? 4 : r <= .75 ? 3 : 2; SCORES.set(url, s); });
  all.filter(([,s]) => s.severe).forEach(([url, s]) => { s.stars = 1; SCORES.set(url, s); });
})();
const PLAT = {crowdworks:'CrowdWorks', coconala:'ココナラ', lancers:'ランサーズ'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function chips(){
  const counts = {}; DATA.jobs.forEach(j => counts[j.genre] = (counts[j.genre]||0) + 1);
  const names = ['すべて', ...Object.keys(counts).sort((a,b) => counts[b]-counts[a])];
  document.getElementById('chips').innerHTML = names.map(n =>
    `<button class="chip" aria-pressed="${n===genre}" data-g="${esc(n)}">${esc(n)} ${n==='すべて' ? DATA.jobs.length : counts[n]}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { genre = b.dataset.g; chips(); render(); });
}

function render(){
  const hide = document.getElementById('hideSeen').checked, sort = document.getElementById('sort').value, ap = document.getElementById('appl').value;
  let jobs = DATA.jobs.filter(j => (genre === 'すべて' || j.genre === genre) && !(hide && seen[j.url]) && (ap === 'all' || (ap === 'done') === !!applied[j.url]));
  if(sort === 'score') jobs.sort((a,b) => SCORES.get(b.url).p - SCORES.get(a.url).p);
  if(sort === 'price') jobs.sort((a,b) => (b.price_min||0) - (a.price_min||0));
  if(sort === 'deadline') jobs.sort((a,b) => (daysLeft(a.expired_on) ?? 999) - (daysLeft(b.expired_on) ?? 999));
  const list = document.getElementById('list');
  if(!jobs.length){ list.innerHTML = '<p class="empty">表示する案件がありません</p>'; return; }
  list.innerHTML = jobs.map(j => {
    const left = daysLeft(j.expired_on);
    const filled = j.hope_number ? `${j.num_contracts||0}/${j.hope_number}人` : '—';
    const isNew = lastVisit && new Date(j.first_seen) > new Date(lastVisit);
    const sc = SCORES.get(j.url);
    return `<article class="card ${seen[j.url] ? 'seen' : ''} ${applied[j.url] ? 'applied' : ''} ${isNew ? 'is-new' : ''}" data-url="${esc(j.url)}">
      <div class="head"><span class="genre">${esc(j.genre)}</span><span>${esc(PLAT[j.platform] || j.platform)}</span><span>公開 ${age(j.posted_at || j.first_seen)}</span><button class="skip" data-act="skip">${seen[j.url] === 'skip' ? '戻す' : '興味なし'}</button></div>
      <div class="rec">${applied[j.url] ? `<span class="done">応募済 ${fmtDate(applied[j.url])}</span>` : ''}<span class="stars" aria-label="おすすめ度 ${sc.stars}/5">${'★'.repeat(sc.stars)}<i>${'★'.repeat(5-sc.stars)}</i></span>${sc.why.map(w => `<span class="why">${esc(w)}</span>`).join('')}${sc.bad.map(w => `<span class="why bad">${esc(w)}</span>`).join('')}</div>
      <h2 class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h2>
      <div class="nums">
        <div class="num ${j.unit_price ? 'hot' : ''}"><b>${esc(j.unit_price || yen(j.price_min))}</b><span>${j.unit_price ? '1本あたり（本文より）' : (j.budget_note || '報酬')}</span></div>
        <div class="num"><b>${filled}</b><span>契約済み/募集</span></div>
        <div class="num ${left !== null && left <= 2 ? 'soon' : ''}"><b>${j.expired_on ? fmtDate(j.expired_on) + (left !== null ? `・残り${Math.max(left,0)}日` : '') : '—'}</b><span>応募期限</span></div>
      </div>
      ${j.take_home || j.client_finished_rate != null ? `<p class="lane">${[j.take_home ? `手取り目安 約${yen(j.take_home)}` : '', j.client_finished_rate != null ? `発注者の完了率 ${j.client_finished_rate}%` : ''].filter(Boolean).join('・')}</p>` : ''}
      ${j.marks.length ? `<div class="marks">${j.marks.map(m => `<span class="mark">${esc(m)}</span>`).join('')}</div>` : ''}
      <p class="sum">${esc(j.summary)}</p>
      <div class="acts">
        <a class="btn main" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="open">案件を開く</a>
        <button class="btn" data-act="draft">応募文を頼む</button>
        <button class="btn ${applied[j.url] ? 'on' : ''}" data-act="apply">${applied[j.url] ? '取り消す' : '応募した'}</button>
        <button class="btn" data-act="more">全文</button>
      </div>
    </article>`;
  }).join('');
  list.querySelectorAll('.card').forEach(card => {
    const url = card.dataset.url;
    card.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', async e => {
      const act = el.dataset.act;
      if(act === 'open'){ if(!seen[url]) { seen[url] = 'open'; store.set('jb:seen', seen); card.classList.add('seen'); } return; }
      if(act === 'apply'){ if(applied[url]) delete applied[url]; else applied[url] = new Date().toISOString(); store.set('jb:applied', applied); render(); return; }
      if(act === 'more'){ card.querySelector('.sum').classList.toggle('open'); return; }
      if(act === 'skip'){ if(seen[url] === 'skip') delete seen[url]; else seen[url] = 'skip'; store.set('jb:seen', seen); render(); return; }
      if(act === 'draft'){
        const text = `この案件の応募文とサンプルを作って（job-apply）: ${url}`;
        try { await navigator.clipboard.writeText(text); } catch(_) { prompt('コピーしてください', text); }
        const t = document.getElementById('toast'); t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800);
      }
    }));
  });
}
document.getElementById('sort').onchange = render;
document.getElementById('hideSeen').onchange = render;
document.getElementById('appl').onchange = render;
chips(); render();
addEventListener('beforeunload', () => store.set('jb:lastVisit', now.toISOString()));
</script>
